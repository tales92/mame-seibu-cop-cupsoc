name: Import full MAME source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import-mame:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import rmonic79 MAME source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cp .github/workflows/build-mame-seibu-cop-cupsoc.yml /tmp/build-mame-seibu-cop-cupsoc.yml

          rm -rf /tmp/mame-source
          git clone --depth 1 --branch seibu-cop-cupsoc https://github.com/rmonic79/mame.git /tmp/mame-source

          mkdir -p /tmp/mame-source/.github/workflows
          cp /tmp/build-mame-seibu-cop-cupsoc.yml /tmp/mame-source/.github/workflows/build-mame-seibu-cop-cupsoc.yml

          cat > /tmp/mame-source/README.md <<'EOF'
          # MAME - Seibu Cup Soccer

          Independent MAME source repository based on rmonic79/mame branch seibu-cop-cupsoc.

          Source commit imported from upstream:
          84ef4b2f862b56563fc76a5e61341081b1123aa7

          This repository keeps the Seibu Cup Soccer COP corrections separate from the tales92/libretro-mame Arrange Audio project.

          The GitHub Actions workflow builds the local MAME source for Windows.
          EOF

          rm -rf /tmp/mame-source/.git

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a /tmp/mame-source/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Import full MAME source from seibu-cop-cupsoc" || true
          git push origin HEAD:main --force

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-mame-seibu-cop-cupsoc.yml/dispatches \
            -d '{"ref":"main"}'
