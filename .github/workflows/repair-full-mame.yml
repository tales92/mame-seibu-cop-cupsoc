name: Repair full MAME tree

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout complete upstream MAME tree
        uses: actions/checkout@v4
        with:
          repository: rmonic79/mame
          ref: 84ef4b2f862b56563fc76a5e61341081b1123aa7
          fetch-depth: 1
          path: upstream-mame

      - name: Restore every tracked upstream file
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream-mame/COPYING
          test -f upstream-mame/attic/fd1094dp.cpp
          test -f upstream-mame/3rdparty/lua-zlib/lua_zlib.c
          rsync -a --exclude='.git/' --exclude='.github/' upstream-mame/ ./
          rm -rf upstream-mame
          cat > README.md <<'EOF'
          # MAME - Seibu Cup Soccer

          Independent MAME source repository based on `rmonic79/mame` branch `seibu-cop-cupsoc`.

          Source commit: `84ef4b2f862b56563fc76a5e61341081b1123aa7`.

          This repository keeps the Seibu Cup Soccer COP corrections separate from the `tales92/libretro-mame` Arrange Audio project.
          EOF
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore complete MAME source tree" || true
          git push origin HEAD:main
